name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
    tags:
      - '*'

  pull_request:
    branches:
      - main
      - staging

env:
  IMAGE_NAME: flask-github-actions
  CONTAINER_NAME: web
  DOCKER_NETWORK: flask-app-network

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up docker compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Build Docker image
        run: |
          docker-compose up --build --abort-on-container-exit --exit-code-from test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}


    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Image Tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          
  deploy:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix file permissions
        run: |
         sudo chmod -R u+rwX .

      - name: SSH Into EC2 Instance
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{secrets.EC2_HOST_IP}}
          username: ${{secrets.EC2_USER_NAME}}
          key: ${{secrets.EC2_SSH_KEY}}
          port: 22
          script: |
            sudo mkdir -p /var/www/html/
            sudo chown -R ${{secrets.EC2_USERNAME}} /var/www/html/
            sudo chmod -R 755 /var/www/html/

      - name: Debug - List Files
        run: |
          ls -la

      - name: Copy Files to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{secrets.EC2_HOST_IP}}
          username: ${{secrets.EC2_USER_NAME}}
          key: ${{secrets.EC2_SSH_KEY}}
          port: 22
          source: "*"
          target: /var/www/html/
        
      - name: Debug - List Files
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{secrets.EC2_HOST_IP}}
          username: ${{secrets.EC2_USER_NAME}}
          key: ${{secrets.EC2_SSH_KEY}}
          port: 22
          script: |
            cd /var/www/html/
            ls -la
